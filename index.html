<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0d10"
  >

  <meta
    name="description"
    content="HYPE – HYbrid Plan & Execution"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <title>HYPE</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="topbar">

      <div>

        <div class="eyebrow">
          ATHLETE PLANNER
        </div>

        <div class="brand-row">

          <h1>HYPE</h1>

          <img
            src="hype-symbol.png"
            class="hype-logo"
            alt=""
            aria-hidden="true"
          >

        </div>

      </div>

      <div
        class="sport-markers"
        aria-hidden="true"
      >
        <span>🏃</span>
        <span>⚡</span>
        <span>🏋️</span>
      </div>

    </header>


    <!-- =========================
         PLAN VIEW
    ========================== -->

    <section
      id="planView"
      class="view"
    >

      <div class="hero">

        <div class="week-navigation">

          <button
            id="weekPrevBtn"
            class="week-nav-arrow"
            type="button"
            aria-label="Vorherige Woche"
          >
            ‹
          </button>


          <div
            id="weekTitleArea"
            class="week-title-area"
          >

            <div class="eyebrow">
              DIESE WOCHE
            </div>

            <h2 id="weekTitle">
              Diese Woche
            </h2>

          </div>


          <button
            id="weekNextBtn"
            class="week-nav-arrow"
            type="button"
            aria-label="Nächste Woche"
          >
            ›
          </button>

        </div>


        <div
          id="heroYear"
          class="hero-year"
        >
          2026
        </div>

      </div>


      <!-- WEEK STRIP -->

      <div
        id="weekStrip"
        class="week-strip"
      ></div>


      <!-- TODAY BUTTON -->

      <div class="today-jump-wrap">

        <button
          id="todayJumpBtn"
          class="today-jump-btn"
          type="button"
        >
          HEUTE
        </button>

      </div>


      <!-- TRAINING PLAN -->

      <section>

        <div class="section-head">

          <div>

            <div class="eyebrow">
              TRAININGSPLAN
            </div>

            <div
              id="selectedDateLabel"
              class="selected-date"
            ></div>

          </div>


          <div class="training-actions">

            <button
              id="calendarExportBtn"
              class="calendar-export-btn"
              type="button"
            >
              🗓 Kalender
            </button>

            <button
              id="addTrainingBtn"
              class="primary"
              type="button"
            >
              + Training
            </button>

          </div>

        </div>


        <div
          id="sessions"
          class="sessions"
        ></div>

      </section>


      <!-- WEEKLY INSIGHT -->

      <div
        id="weeklyInsight"
        class="insight"
      ></div>

    </section>


    <!-- =========================
         OVERVIEW VIEW
    ========================== -->

    <section
      id="overviewView"
      class="view hidden"
    >

      <div class="overview-header">

        <div>

          <div class="eyebrow">
            TRAININGSÜBERSICHT
          </div>

          <h2>
            Übersicht
          </h2>

        </div>

      </div>


      <!-- PERIOD SWITCH -->

      <div class="period-switch">

        <button
          class="period-btn active"
          data-period="week"
          type="button"
        >
          Woche
        </button>

        <button
          class="period-btn"
          data-period="month"
          type="button"
        >
          Monat
        </button>

        <button
          class="period-btn"
          data-period="year"
          type="button"
        >
          Jahr
        </button>

      </div>


      <!-- PERIOD NAVIGATION -->

      <div class="period-navigation">

        <button
          id="periodPrevBtn"
          class="period-arrow"
          type="button"
          aria-label="Vorheriger Zeitraum"
        >
          ‹
        </button>


        <button
          id="periodTodayBtn"
          class="period-title-button"
          type="button"
        >
          <span id="periodTitle">
            Diese Woche
          </span>
        </button>


        <button
          id="periodNextBtn"
          class="period-arrow"
          type="button"
          aria-label="Nächster Zeitraum"
        >
          ›
        </button>

      </div>


      <!-- OVERVIEW CONTENT -->

      <div
        id="overviewContent"
      ></div>

    </section>


    <!-- =========================
         TODAY VIEW
    ========================== -->

    <section
      id="todayView"
      class="view hidden"
    >

      <div class="hero today-hero">

        <div>

          <div class="eyebrow">
            HEUTE
          </div>

          <h2 id="todayTitle">
            Heute
          </h2>

        </div>

        <div class="today-symbol">
          ●
        </div>

      </div>


      <div
        id="todayContent"
      ></div>

    </section>

  </main>


  <!-- =========================
       BOTTOM NAVIGATION
  ========================== -->

  <nav class="bottom-nav">

    <button
      class="nav-item active"
      data-view="plan"
      type="button"
    >

      <span class="nav-icon">
        ▣
      </span>

      <span>
        Woche
      </span>

    </button>


    <button
      class="nav-item"
      data-view="overview"
      type="button"
    >

      <span class="nav-icon">
        ▦
      </span>

      <span>
        Übersicht
      </span>

    </button>

  </nav>


  <!-- =========================
       TRAINING DIALOG
  ========================== -->

  <dialog id="trainingDialog">

    <form id="trainingForm">

      <div class="dialog-head">

        <div>

          <div class="eyebrow">
            TRAINING
          </div>

          <h3 id="dialogTitle">
            Training hinzufügen
          </h3>

        </div>


        <button
          type="button"
          class="close"
          id="closeDialogBtn"
          aria-label="Schließen"
        >
          ×
        </button>

      </div>


      <label>

        Sport

        <select
          id="sportInput"
          required
        >

          <option value="running">
            🏃 Laufen
          </option>

          <option value="strength">
            🏋️ Krafttraining
          </option>

          <option value="hyrox">
            ⚡ HYROX
          </option>

          <option value="cycling">
            🚴 Rad
          </option>

          <option value="swimming">
            🏊 Schwimmen
          </option>

          <option value="mobility">
            🧘 Mobility
          </option>

          <option value="rest">
            😴 Erholung
          </option>

        </select>

      </label>


      <label>

        Titel

        <input
          id="titleInput"
          type="text"
          placeholder="z. B. Easy Run"
          required
        >

      </label>


      <div class="two">

        <label>

          Dauer

          <input
            id="durationInput"
            type="number"
            min="1"
            step="1"
            value="45"
            required
          >

        </label>


        <label>

          Intensität

          <select id="intensityInput">

            <option value="0">
              0 · entspannend
            </option>

            <option value="1">
              1 · sehr leicht
            </option>

            <option value="2">
              2 · leicht
            </option>

            <option
              value="3"
              selected
            >
              3 · moderat
            </option>

            <option value="4">
              4 · hart
            </option>

            <option value="5">
              5 · sehr hart
            </option>

          </select>

        </label>

      </div>


      <label>

        Notizen

        <textarea
          id="notesInput"
          rows="4"
          placeholder="z. B. 5 × 1 km @ 4:30/km"
        ></textarea>

      </label>


      <button
        type="submit"
        class="primary full"
      >
        Training speichern
      </button>

    </form>

  </dialog>


  <!-- =========================
       SCRIPTS
  ========================== -->

  <script src="calendar.js"></script>
  <script src="app.js"></script>

</body>
</html>
